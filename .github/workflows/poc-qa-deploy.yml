name: BAW PoC - QA Deployment and Verification

on:
  workflow_dispatch: # Temporary manual trigger for PoC connection testing
  push:
    paths:
      - '**.json' # Triggers automatically when BAW Center pushes a metadata file

# Forces snapshots to wait in line so they don't overwrite each other in QA
concurrency:
  group: baw-qa-pipeline
  cancel-in-progress: false

jobs:
  # JOB 1: Pull details and trigger the local REST API deployment
  extract-and-deploy:
    runs-on: self-hosted 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # 💡 HELPFUL ADDITION: Automatically parse the app acronym and snapshot name 
      # from the JSON file that BAW just pushed into the repository!
      - name: Parse BAW Payload Info
        id: parse_payload
        run: |
          # BAW pushes a JSON file with metadata. Let's find it and extract values dynamically.
          # (Replace 'payload.json' if BAW saves it under a distinct naming convention in your repo)
          echo "PROCESS_APP=$(jq -r '.projectShortName' payload.json)" >> $GITHUB_ENV
          echo "SNAPSHOT=$(jq -r '.snapshotName' payload.json)" >> $GITHUB_ENV

      - name: Run E2E BAW Deployment
        env:
          VERIFY_SSL: "false"
          CENTER_HOST: ${{ secrets.BAW_CENTER_HOST }}
          CENTER_PORT: ${{ secrets.BAW_CENTER_PORT }}
          CENTER_USER: ${{ secrets.BAW_CENTER_USER }}
          CENTER_PASSWORD: ${{ secrets.BAW_CENTER_PASSWORD }}
          QA_HOST: ${{ secrets.BAW_QA_HOST }}
          QA_PORT: ${{ secrets.BAW_QA_PORT }}
          QA_USER: ${{ secrets.BAW_QA_USER }}
          QA_PASSWORD: ${{ secrets.BAW_QA_PASSWORD }}
          
          # Dynamic Inputs parsed from the Git Commit instead of manual inputs
          PROCESS_APP_ACRONYM: ${{ env.PROCESS_APP }}
          SNAPSHOT_NAME: ${{ env.SNAPSHOT }}
          OFFLINE_SERVER_ACRONYM: "QA_SERVER" 
        run: |
          chmod +x .github/scripts/poc-qa-swploy.sh
          .github/scripts/poc-qa-deploy.sh


  # JOB 2: The Post-Deployment Human Sign-Off Gate
  qa-testing-signoff:
    needs: deploy-to-qa # Only fires if Job 1 passes perfectly
    runs-on: self-hosted
    environment: QA-Verification # Halts the pipeline here to request manual user approval
    
    steps:
      - name: Confirm Testing Success
        run: |
          echo "Verification Complete! The QA Team successfully validated this snapshot version."
