name: BAW PoC - QA Deployment and Verification

on:
  workflow_dispatch:
    inputs:
      app_acronym:
        description: "Process App Acronym (e.g. MYAPP) — required for manual runs"
        required: true
        type: string
      snapshot_acronym:
        description: "Snapshot Acronym (e.g. SS1.0) — required for manual runs"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'workflow/**/*.json' # Triggers automatically when BAW Center pushes a metadata file

# Top-level env — change VERIFY_SSL to "true" once real TLS certificates are in place
env:
  VERIFY_SSL: "false"
  OFFLINE_SERVER_ACRONYM: "QA_SERVER"

# Forces snapshots to wait in line so they don't overwrite each other in QA
concurrency:
  group: baw-qa-pipeline
  cancel-in-progress: false

jobs:
  # JOB 1: Pull details and trigger the local REST API deployment
  extract-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse BAW Payload Info
        id: parse_payload
        run: |
          # On manual dispatch, use the inputs directly — no JSON file to parse
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP_ACRONYM="${{ inputs.app_acronym }}"
            SNAP_NAME="${{ inputs.snapshot_acronym }}"
            echo "📋 Manual dispatch — using provided inputs: App=$APP_ACRONYM, Snapshot=$SNAP_NAME"
          else
            # Find the descriptor file that was added or modified in the triggering commit.
            # Using git diff against the previous commit ensures we always process the
            # newly pushed file, not whichever file happens to sort first in the repo.
            JSON_FILE=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'workflow/**/*_descriptor.json' | head -n 1)

            # Fallback: if this is the very first commit (no HEAD~1), diff against empty tree
            if [ -z "$JSON_FILE" ]; then
              JSON_FILE=$(git diff --name-only --diff-filter=AM \
                $(git hash-object -t tree /dev/null) HEAD -- 'workflow/**/*_descriptor.json' | head -n 1)
            fi

            if [ -z "$JSON_FILE" ] || [ ! -f "$JSON_FILE" ]; then
              echo "❌ Error: No *_descriptor.json file was added or modified in this push."
              echo "   Commit: ${{ github.sha }}"
              echo "   Changed files in this commit:"
              git diff --name-only HEAD~1 HEAD || git show --name-only --format="" HEAD
              exit 1
            fi

            echo "📁 Found BAW Descriptor Path: $JSON_FILE"

            APP_ACRONYM=$(jq -r '.project_short_name // empty' "$JSON_FILE")
            SNAP_NAME=$(jq -r '.snapshot_acronym // empty' "$JSON_FILE")

            if [ -z "$APP_ACRONYM" ] || [ -z "$SNAP_NAME" ]; then
              echo "❌ Error: Failed to parse project_short_name or snapshot_acronym from JSON."
              echo "   File: $JSON_FILE"
              echo "   Contents:"
              cat "$JSON_FILE"
              exit 1
            fi
          fi

          echo "✅ Target identified: App=$APP_ACRONYM, Snapshot=$SNAP_NAME"
          echo "app_acronym=$APP_ACRONYM" >> "$GITHUB_OUTPUT"
          echo "snapshot_acronym=$SNAP_NAME" >> "$GITHUB_OUTPUT"

      - name: Run E2E BAW Deployment
        env:
          CENTER_HOST: ${{ secrets.BAW_CENTER_HOST }}
          CENTER_PORT: ${{ secrets.BAW_CENTER_PORT }}
          CENTER_USER: ${{ secrets.BAW_CENTER_USER }}
          CENTER_PASSWORD: ${{ secrets.BAW_CENTER_PASSWORD }}
          QA_HOST: ${{ secrets.BAW_QA_HOST }}
          QA_PORT: ${{ secrets.BAW_QA_PORT }}
          QA_USER: ${{ secrets.BAW_QA_USER }}
          QA_PASSWORD: ${{ secrets.BAW_QA_PASSWORD }}
          PROCESS_APP_ACRONYM: ${{ steps.parse_payload.outputs.app_acronym }}
          SNAPSHOT_NAME: ${{ steps.parse_payload.outputs.snapshot_acronym }}
        run: |
          # chmod is here because self-hosted runners may not preserve the execute bit
          chmod +x .github/scripts/poc-qa-deploy.sh
          .github/scripts/poc-qa-deploy.sh

  # JOB 2: The Post-Deployment Human Sign-Off Gate
  qa-testing-signoff:
    needs: extract-and-deploy # Only fires if Job 1 passes perfectly
    runs-on: self-hosted
    environment: QA-Verification # Halts the pipeline here to request manual user approval
    timeout-minutes: 1440 # 24 hours — prevents the approval gate from blocking the queue indefinitely

    steps:
      - name: Confirm Testing Success
        run: |
          echo "Verification Complete! The QA Team successfully validated this snapshot version."
